<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#122129"><title>HARBORLINE — Portside District</title><meta name="description" content="해 질 무렵의 항구도시 포트사이드를 걸어서 탐험하는 3인칭 3D 게임."><link rel="icon" href="/harbor.svg"></head>
<body>
<main id="game" aria-label="HARBORLINE 항구 탐험">
<canvas id="world" tabindex="0" aria-label="3D 게임 화면. WASD로 이동하고 드래그로 시점을 돌려."></canvas>
<div id="shade"></div>
<header class="top">
 <div class="brand"><img src="/harbor.svg" alt=""><div class="wordmark">HARBORLINE</div></div>
 <div class="compass" aria-label="나침반"><div id="bearings"></div><i></i></div>
 <div class="actions"><div class="clock"><svg viewBox="0 0 24 24"><path d="M3 16h18M6 19h12M7 13a5 5 0 0 1 10 0M12 3v3M3.5 6.5l2 2M20.5 6.5l-2 2"/></svg><time>19:42</time></div><div class="divider"></div><button id="sound" class="icon-button" title="항구 환경음 켜기" aria-label="항구 환경음 켜기"></button><button id="pause" class="icon-button" title="일시 정지 (Esc)" aria-label="일시 정지"><svg viewBox="0 0 24 24"><path d="M8 5v14M16 5v14" stroke-width="3"/></svg></button></div>
</header>
<div class="mode"><i></i> FREE ROAM</div>
<section class="location"><button id="mini-button" title="구역 지도 열기 (M)" aria-label="구역 지도 열기"><canvas id="mini"></canvas><span class="map-north">N</span><span class="map-expand">⛶</span></button>
<div class="location-type"><b></b> HARBOR DISTRICT</div><div id="loc-name">Breakwater Ave.</div></section>
<div class="shortcuts"><div><span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd></span><strong>이동</strong></div><div><kbd>SHIFT</kbd><strong>달리기</strong></div><button id="controls"><span class="keysym">?</span> 조작법</button></div>
<div id="touch"><div id="stick" aria-label="이동 조이스틱"><i></i></div><button id="run" aria-label="달리기">⇧</button></div>
<button id="interact" hidden><kbd>E</kbd><span></span></button><div id="toast" aria-live="polite"></div>
<div id="status" role="status"><span class="spinner"></span><b>부두를 불러오는 중</b></div>
<div id="overlay" hidden><section id="panel" role="dialog" aria-modal="true" aria-labelledby="panel-title"><div class="panel-heading"><small id="eyebrow">HARBORLINE</small><button id="close" class="icon-button" aria-label="닫기">×</button></div><h1 id="panel-title"></h1><div id="panel-body"></div></section></div>
</main>
<script type="module" src="/src/main.js"></script>
</body></html>
