<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#122129"><title>Harborline</title><meta name="description" content="해 질 무렵의 항구도시 포트사이드를 걸어서 탐험하는 3인칭 3D 게임."><link rel="icon" type="image/png" href="/icons/harborline-pwa-192-v5.png"><link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/icons/harborline-pwa-192-v5.png"><meta name="application-name" content="Harborline"><meta name="apple-mobile-web-app-title" content="Harborline"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="/src/style.css">
<link rel="stylesheet" href="/src/world-intro.css">
<link rel="stylesheet" href="/src/cinematic-intro.css">
</head>
<body>
<section id="cinematic-intro" aria-label="HARBORLINE 인트로" tabindex="-1">
 <div id="intro-frame"><video id="intro-video" src="/assets/intro/HL_GTA_Intro_Clean_Voice.mp4" playsinline preload="metadata" aria-label="HARBORLINE 시네마틱 영상"></video></div>
 <div id="intro-recovery" hidden>
  <p id="intro-message" role="status"></p>
  <button id="intro-retry" type="button">다시 시도</button>
 </div>
 <button id="intro-skip" type="button">건너뛰기</button>
 <button id="intro-audio" type="button" hidden>소리 켜기</button>
</section>
<main id="game" inert aria-label="HARBORLINE 항구 탐험">
<canvas id="world" tabindex="0" aria-label="3D 게임 화면. WASD로 이동하고 드래그로 시점을 돌려."></canvas>
<div id="shade"></div>
<div id="injury-vignette" aria-hidden="true"></div><div id="damage-flash" aria-hidden="true"></div>
<header class="top">
 <button id="mini-button" type="button" title="구역 지도 열기 (M)" aria-label="구역 지도 열기"><canvas id="mini"></canvas><span class="map-north" aria-hidden="true">N</span></button>
 <div class="compass" aria-label="나침반"><div id="bearings"></div><i></i></div>
 <div class="actions"><div class="clock"><svg viewBox="0 0 24 24"><path d="M3 16h18M6 19h12M7 13a5 5 0 0 1 10 0M12 3v3M3.5 6.5l2 2M20.5 6.5l-2 2"/></svg><time id="game-clock" datetime="19:42">19:42</time></div><div class="divider"></div><button id="sound" class="icon-button" title="항구 환경음 켜기" aria-label="항구 환경음 켜기"></button><button id="pause" class="icon-button" title="설정 (Esc)" aria-label="설정"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9.7 3.6.5-1.1h3.6l.5 1.1.4 1.6 1.4.8 1.6-.5 1.2.1 1.8 3.1-.6 1-1.2 1.1v1.6l1.2 1.1.6 1-1.8 3.1-1.2.1-1.6-.5-1.4.8-.4 1.6-.5 1.1h-3.6l-.5-1.1-.4-1.6-1.4-.8-1.6.5-1.2-.1-1.8-3.1.6-1 1.2-1.1v-1.6L3.9 10.2l-.6-1 1.8-3.1 1.2-.1 1.6.5 1.4-.8z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
</header>
<div id="speed" hidden><small>D</small><b>0</b><span>KM/H</span></div><div id="objective" hidden><strong></strong><span></span><small></small></div>
<label id="oxygen" hidden>산소 <meter min="0" max="1" value="1" aria-label="남은 산소"></meter></label>
<button id="dive-toggle" class="marine-action" type="button" hidden><kbd>Space</kbd> <span>잠수</span></button>
<div id="mission-event" hidden role="status" aria-live="polite"><small></small><strong></strong><span></span></div><div id="guide-frame" aria-hidden="true"><div id="guide-marker" hidden><i></i><span></span></div></div><div class="shortcuts"><div><span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd></span><strong class="walking-label">이동</strong><strong class="driving-label">가속 · 조향</strong></div><div><kbd class="walking-label">SHIFT</kbd><strong class="walking-label">걷기 전환</strong><kbd class="driving-label">SPACE</kbd><strong class="driving-label">핸드브레이크</strong></div></div>
<div id="equipment-hud">
 <button id="gear-menu" type="button" title="장비함 (Q)">장비함</button>
 <span id="gear-status" hidden></span>
 <button id="gear-aim" type="button" aria-pressed="false" hidden>조준</button>
 <button id="gear-next" type="button" aria-label="다음 장비">전환</button>
 <button id="gear-reload" type="button" hidden>재장전</button>
</div><i id="gear-reticle" aria-hidden="true" hidden></i>
<div id="sniper-scope" aria-hidden="true" hidden><div><i></i><small>4×</small></div></div>
<div id="vehicle-tools" hidden aria-label="차량 조작"><button data-vehicle="horn">경적</button><button data-vehicle="lights">전조등</button><button data-vehicle="radio">라디오</button></div>
<div id="touch"><div id="stick" aria-label="이동 조이스틱"><i></i></div><div id="pedals"><button data-pedal="hold">주차<br>브레이크</button><button data-pedal="brake">제동<br>후진</button><button data-pedal="gas">가속</button></div><button id="punch" type="button" class="foot-action" aria-label="주먹 공격">
 <svg class="attack-melee" viewBox="0 0 32 32" aria-hidden="true"><path fill="currentColor" d="M9 28v-4.8L5 19.1a3 3 0 0 1-.6-3.3l1.2-2.6a2.4 2.4 0 0 1 3.1-1.1l1.5.7v-3a2.2 2.2 0 0 1 4.4-.3V8.4a2.2 2.2 0 1 1 4.4 0v.5a2.2 2.2 0 0 1 4.4 0v1.2a2.15 2.15 0 0 1 4.3.2v7.3c0 2.4-1.35 4.25-3.2 5.75V28z"/><path d="M10.2 12.8 14 15a2.4 2.4 0 0 1-1.4 4.5l-2-.7" fill="none" stroke="#27383e" stroke-width="1.4" stroke-linecap="round"/></svg>
 <svg class="attack-ranged" viewBox="0 0 32 32" aria-hidden="true"><path d="m11 17 8.2-8.2L27 6l-2.8 7.8L16 22z" fill="currentColor"/><path d="m10 18.2 5 5-2.6 2.7c-.5.5-1.2.5-1.7 0L7 22.2c-.5-.5-.5-1.2 0-1.7z" fill="currentColor"/><path d="m4 16 4-4M4 27l2-2m12 2 4-4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
</button><button id="jump" class="foot-action" aria-label="점프">점프</button></div>
<div id="interact" aria-label="주변 상호작용" hidden><div id="interaction-options"></div></div><div id="toast" aria-live="polite"></div>
<aside id="conversation" aria-labelledby="speaker-name" hidden>
 <header><div><strong id="speaker-name"></strong><small></small></div><button id="dialogue-close" type="button" aria-label="대화 마치기">×</button></header>
 <p class="spoken" aria-live="polite"></p>
 <div class="episode-choices" role="group" aria-label="대화 선택지"></div>
</aside><div id="vitals" hidden>
 <div class="health-caption"><span>체력</span><b class="health-count">100/100</b></div>
 <div class="health-meter" role="meter" aria-label="플레이어 체력" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100"><i class="health-trail"></i><i class="health-fill"></i></div>
 <span class="health-armor"></span><span class="health-opponent"></span>
</div>
<section id="update-notice" class="update-notice" aria-label="새 업데이트" hidden>
 <strong>새 업데이트</strong><p id="update-notice-status" role="status"></p>
 <div><button type="button" data-update="later">나중에</button><button type="button" data-update="apply">저장 후 업데이트</button></div>
</section>
<div id="overlay" hidden><section id="panel" role="dialog" aria-modal="true" aria-labelledby="panel-title"><div class="panel-heading"><div><button id="settings-back" type="button" hidden>‹ 설정 목록</button><small id="eyebrow">HARBORLINE</small></div><button id="close" class="icon-button" aria-label="닫기">×</button></div><h1 id="panel-title"></h1><div id="panel-body"></div></section></div>
<dialog id="death-screen" aria-labelledby="death-title" aria-describedby="death-status">
 <h2 id="death-title" lang="en">WASTED</h2>
 <p id="death-status" class="death-status" role="status" hidden></p>
 <div class="death-actions">
  <button id="death-retry" type="button" hidden disabled>체크포인트에서 계속</button>
  <button id="death-continue" type="button" disabled>부활</button>
 </div>
</dialog>
</main>
<div id="status" role="status" aria-hidden="true"><img src="/assets/intro/loading-logo.png" width="70" height="50" alt=""><b>부두를 불러오는 중</b></div>
<script type="module" src="/src/cinematic-intro.js"></script>
<script>if ('serviceWorker' in navigator && location.protocol !== 'file:') { window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js', { updateViaCache: 'none' }).catch(error => console.warn('Service worker registration failed', error))); }</script>
</body></html>
