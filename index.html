<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#122129"><title>HARBORLINE — Player &amp; Living City</title><meta name="description" content="해 질 무렵의 항구도시 포트사이드를 걸어서 탐험하는 3인칭 3D 게임."><link rel="icon" href="/harbor.svg"><link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/icons/harborline-pwa-192-v4.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="/src/style.css">
<link rel="stylesheet" href="/src/world-intro.css">
<link rel="stylesheet" href="/src/cinematic-intro.css">
</head>
<body>
<section id="cinematic-intro" aria-label="HARBORLINE 인트로" tabindex="-1">
 <div id="intro-frame"><video id="intro-video" src="/assets/intro/HL_GTA_Intro_Clean_Voice.mp4" playsinline preload="metadata" aria-label="HARBORLINE 시네마틱 영상"></video></div>
 <div id="intro-recovery" hidden>
  <p id="intro-message" role="status"></p>
  <button id="intro-retry" type="button">다시 시도</button>
 </div>
 <button id="intro-skip" type="button">건너뛰기</button>
 <button id="intro-audio" type="button" hidden>소리 켜기</button>
</section>
<main id="game" inert aria-label="HARBORLINE 항구 탐험">
<canvas id="world" tabindex="0" aria-label="3D 게임 화면. WASD로 이동하고 드래그로 시점을 돌려."></canvas>
<div id="shade"></div>
<header class="top">
 <div class="brand"><img src="/harbor.svg" alt=""><div class="wordmark">HARBORLINE</div></div>
 <div class="compass" aria-label="나침반"><div id="bearings"></div><i></i></div>
 <div class="actions"><div class="clock"><svg viewBox="0 0 24 24"><path d="M3 16h18M6 19h12M7 13a5 5 0 0 1 10 0M12 3v3M3.5 6.5l2 2M20.5 6.5l-2 2"/></svg><time>19:42</time></div><div class="divider"></div><button id="sound" class="icon-button" title="항구 환경음 켜기" aria-label="항구 환경음 켜기"></button><button id="pause" class="icon-button" title="일시 정지 (Esc)" aria-label="일시 정지"><svg viewBox="0 0 24 24"><path d="M8 5v14M16 5v14" stroke-width="3"/></svg></button></div>
</header>
<div class="mode"><i></i> <span id="play-mode">싱글플레이</span></div>
<section class="location"><button id="mini-button" title="구역 지도 열기 (M)" aria-label="구역 지도 열기"><canvas id="mini"></canvas><span class="map-north">N</span><span class="map-expand">⛶</span></button>
<div class="location-type"><b></b> HARBOR DISTRICT</div><div id="loc-name">Breakwater Ave.</div></section>
<div id="speed" hidden><small>D</small><b>0</b><span>KM/H</span></div><div id="objective" hidden></div><div id="guide-frame" aria-hidden="true"><div id="guide-marker" hidden><i></i><span></span></div></div><div class="shortcuts"><div><span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd></span><strong class="walking-label">이동</strong><strong class="driving-label">가속 · 조향</strong></div><div><kbd class="walking-label">SHIFT</kbd><strong class="walking-label">달리기</strong><kbd class="driving-label">SPACE</kbd><strong class="driving-label">핸드브레이크</strong></div><button id="controls"><span class="keysym">?</span> 조작법</button></div>
<div id="equipment-hud">
 <button id="gear-menu" type="button" title="장비함 (Q)">장비함</button>
 <span id="gear-status" hidden></span>
 <button id="gear-aim" type="button" aria-pressed="false" hidden>조준</button>
 <button id="gear-reload" type="button" hidden>재장전</button>
</div><i id="gear-reticle" aria-hidden="true" hidden></i>
<div id="touch"><div id="stick" aria-label="이동 조이스틱"><i></i></div><div id="pedals"><button data-pedal="hold">주차<br>브레이크</button><button data-pedal="brake">제동<br>후진</button><button data-pedal="gas">가속</button></div><button id="punch" class="foot-action" aria-label="주먹 공격">공격</button><button id="jump" class="foot-action" aria-label="점프">점프</button></div>
<button id="interact" hidden><kbd>E</kbd><span></span></button><div id="toast" aria-live="polite"></div>
<aside id="conversation" aria-live="polite" hidden><header><strong></strong><small></small></header><p class="spoken"></p></aside><div id="vitals" hidden><b></b><span></span></div>
<div id="overlay" hidden><section id="panel" role="dialog" aria-modal="true" aria-labelledby="panel-title"><div class="panel-heading"><small id="eyebrow">HARBORLINE</small><button id="close" class="icon-button" aria-label="닫기">×</button></div><h1 id="panel-title"></h1><div id="panel-body"></div></section></div>
</main>
<div id="status" role="status" aria-hidden="true"><img src="/assets/intro/loading-logo.png" width="70" height="50" alt=""><b>부두를 불러오는 중</b></div>
<script type="module" src="/src/cinematic-intro.js"></script>
<script>if ('serviceWorker' in navigator && location.protocol !== 'file:') { window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js', { updateViaCache: 'none' }).catch(error => console.warn('Service worker registration failed', error))); }</script>
</body></html>
